<!-- ======================================================================= -->
<!-- 4K STATİK DUVAR KAĞIDI & SPLASH TAM EKRAN ÖNİZLEME MODALI -->
<!-- ======================================================================= -->
<div id="static-wallpaper-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden transition-all duration-300">
  <div class="relative w-full max-w-5xl bg-[#030914] border border-emerald-500/50 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
    
    <!-- Modal Header -->
    <div class="px-5 py-3 border-b border-hextech-borderSubtle flex items-center justify-between bg-gradient-to-r from-[#020710] to-[#04121e] shrink-0">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-emerald-400">
          <i data-lucide="image" class="w-4 h-4"></i>
        </div>
        <div>
          <h3 id="static-modal-title" class="text-sm font-extrabold text-gray-100 flex items-center space-x-2">
            <span>Kostüm Adı</span>
          </h3>
          <p id="static-modal-subtitle" class="text-[11px] text-gray-400">Şampiyon • Orijinal Riot Splash</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <span id="static-modal-res-badge" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
          4K UHD
        </span>
        <button onclick="closeStaticWallpaperModal()" class="w-8 h-8 rounded-lg bg-hextech-card hover:bg-hextech-cardHover border border-hextech-borderSubtle text-gray-400 hover:text-white flex items-center justify-center cursor-pointer transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Modal Body: Image Preview Container -->
    <div class="relative flex-1 bg-black/95 flex items-center justify-center overflow-hidden p-2 select-none min-h-[360px]">
      <img id="static-modal-img" src="" alt="4K Wallpaper Preview" class="max-w-full max-h-[68vh] object-contain rounded shadow-2xl transition-all duration-300">
      
      <!-- Loading indicator overlay -->
      <div id="static-modal-img-loading" class="absolute inset-0 flex items-center justify-center bg-black/60 hidden">
        <div class="w-10 h-10 border-4 border-hextech-borderSubtle border-t-emerald-400 rounded-full animate-spin"></div>
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="px-5 py-3 border-t border-hextech-borderSubtle flex flex-wrap items-center justify-between gap-3 bg-[#020710] shrink-0">
      <div class="flex items-center space-x-2 text-xs text-gray-400">
        <span id="static-modal-info-text">LoL Fandom HD Master • UHD Paper 4K • Riot Games Koleksiyonu</span>
      </div>

      <div class="flex items-center space-x-2.5">
        <button id="static-modal-btn-download" onclick="downloadModalStaticWallpaper(false)" class="px-4 py-2 rounded-xl text-xs font-bold bg-hextech-card hover:bg-hextech-cardHover border border-emerald-500/50 text-emerald-300 flex items-center space-x-1.5 cursor-pointer transition shadow">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>4K İndir</span>
        </button>

        <button id="static-modal-btn-desktop" onclick="downloadModalStaticWallpaper(true)" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-gray-950 flex items-center space-x-1.5 cursor-pointer shadow-lg transition">
          <i data-lucide="monitor" class="w-4 h-4"></i>
          <span>Masaüstü Duvar Kağıdı Yap</span>
        </button>
      </div>
    </div>

  </div>
</div>
