  <!-- Immediate LocalStorage Zoom Restore -->
  <script>
    (function() {
      try {
        var savedZoom = localStorage.getItem('app_zoom_level');
        if (savedZoom) {
          var z = parseFloat(savedZoom);
          if (!isNaN(z) && z >= 0.5 && z <= 2.5) {
            document.documentElement.style.zoom = z;
            window.addEventListener('DOMContentLoaded', function() {
              document.documentElement.style.zoom = z;
              setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 50);
            });
          }
        }
      } catch(e) {}
    })();
  </script>
